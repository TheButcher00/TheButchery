<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE BUTCHERY</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: #0a0a0a;
      color: #e5e5e5;
      font-family: 'Courier New', monospace;
    }
    
    .glitch {
      position: relative;
      color: #ff00ff;
      font-size: 4.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .glitch::before {
      color: #00ffff;
      animation: glitch-anim 2s infinite linear alternate-reverse;
      left: 2px;
      text-shadow: -2px 0 #ff00ff;
    }
    
    .glitch::after {
      color: #ff00ff;
      animation: glitch-anim2 3s infinite linear alternate-reverse;
      left: -2px;
      text-shadow: 2px 0 #00ffff;
    }

    @keyframes glitch-anim {
      0% { clip: rect(20px, 9999px, 50px, 0); }
      100% { clip: rect(80px, 9999px, 120px, 0); }
    }
    
    .set-card {
      transition: all 0.3s ease;
      background: #111111;
    }
    
    .set-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 0 30px rgba(255, 0, 80, 0.6);
      border-color: #ff0050;
    }

    .neon-text {
      text-shadow: 0 0 10px #ff00ff,
                   0 0 20px #ff00ff;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- NAV -->
  <nav class="border-b border-zinc-800 bg-black/80 backdrop-blur-md fixed w-full z-50">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-widest">BUTCHERY</h1>
      <div class="space-x-8 text-sm uppercase tracking-widest">
        <a href="#sets" class="hover:text-pink-500 transition">SETS</a>
        <a href="#video" class="hover:text-pink-500 transition">VIDEO</a>
        <a href="#about" class="hover:text-pink-500 transition">ABOUT</a>
        <a href="#booking" class="hover:text-pink-500 transition">BOOKING</a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="min-h-screen flex items-center justify-center pt-20 border-b border-zinc-900">
    <div class="text-center">
      <h1 class="glitch" data-text="THE BUTCHERY">THE BUTCHERY</h1>
      <p class="text-xl mt-4 text-zinc-400 tracking-[4px] uppercase">Techno • Raw • Unfiltered</p>
      
      <div class="mt-16">
        <a href="#latest" 
           class="inline-block px-12 py-6 border border-pink-600 text-pink-500 hover:bg-pink-600 hover:text-black transition text-lg tracking-widest">
          LISTEN LATEST SET →
        </a>
      </div>
    </div>
  </section>

  <!-- LATEST SET -->
  <section id="latest" class="max-w-6xl mx-auto px-6 py-20">
    <h2 class="text-3xl font-bold mb-10 border-l-4 border-pink-600 pl-4">LATEST MASSACRE</h2>
    <!-- Incolla qui l'embed SoundCloud o Mixcloud -->
    <div class="bg-black p-4 border border-zinc-800">
      <!-- Esempio SoundCloud embed -->
      <iframe width="100%" height="166" scrolling="no" frameborder="no" 
        src="https://w.soundcloud.com/player/?url=https://soundcloud.com/tuoutente/il-tuo-set&amp;color=%23ff0050">
      </iframe>
    </div>
  </section>

  <!-- ALL SETS -->
  <section id="sets" class="max-w-6xl mx-auto px-6 py-20 bg-zinc-950">
    <h2 class="text-3xl font-bold mb-12">ALL SETS</h2>
    
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Ripeti questo blocco per ogni set -->
      <div class="set-card border border-zinc-800 p-6 group">
        <div class="aspect-video bg-zinc-900 mb-4 flex items-center justify-center text-4xl">🎛️</div>
        <h3 class="text-lg font-bold">01.01.2026 - Rave in The Abyss</h3>
        <p class="text-zinc-500 text-sm">2h 14min • Techno / Hard Techno</p>
        <button class="mt-4 text-pink-500 hover:text-pink-400 text-sm uppercase tracking-widest">
          ▶️ Play Full Set
        </button>
      </div>
    </div>
  </section>

  <footer class="border-t border-zinc-800 py-12 text-center text-zinc-500 text-sm">
    <p>THE BUTCHERY © 2026 — All rights reserved.</p>
    <p class="mt-2">Raw techno only.</p>
  </footer>

</body>
</html>
